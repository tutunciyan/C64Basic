name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # no display or sound card on the runners: SDL's dummy drivers still exercise the whole window code path
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      # GPL, so fetched here instead of kept in the repository; the test skips where the file is missing
      - name: Fetch the 6502 functional test
        shell: bash
        run: |
          mkdir -p roms/cputests
          curl -fsSL -o roms/cputests/6502_functional_test.bin https://raw.githubusercontent.com/Klaus2m5/6502_65C02_functional_tests/master/bin_files/6502_functional_test.bin
      - run: dotnet build C64Basic.slnx --configuration Release
      - run: dotnet test tests/C64Basic.Tests --configuration Release --no-build

  publish:
    # self-contained builds of the window version, attached to a GitHub release when a v* tag is pushed
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        rid: [win-x64, linux-x64, osx-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      # a folder, not a single file: SDL2 must sit next to the executable
      - name: Publish the GUI
        run: >
          dotnet publish src/C64Basic.Gui -c Release -r ${{ matrix.rid }} --self-contained -o out/gui
      - run: |
          mkdir dist
          cp LICENSE out/gui/
          (cd out/gui && zip -r ../../dist/C64Basic-gui-${{ matrix.rid }}.zip .)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
